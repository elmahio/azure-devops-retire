name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20 # Ensure the Node.js version matches your task runtime

      - name: Install Dependencies
        run: npm install
        working-directory: tasks/retire

      - name: Patch vss-extension.json
        uses: onlyutkarsh/patch-files-action@v1.0.3
        with:
          files: vss-extension.json
          patch-syntax: = /version => "1.3.${{ github.run_number }}"
          fail-if-no-files-patched: true

      - name: Patch task.json
        uses: onlyutkarsh/patch-files-action@v1.0.3
        with:
          files: tasks/retire/task.json
          patch-syntax: |
            = /version/Major => "1"
            = /version/Minor => "3"
            = /version/Patch => "${{ github.run_number }}"
          fail-if-no-files-patched: true

      - name: Install tfx-cli
        run: npm install -g tfx-cli

      - name: Build vsix
        run: tfx extension create --manifest-globs vss-extension.json

      - name: Create Release
        if: ${{ github.event_name == 'push' }}
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./elmahio.retire-extension-1.3.${{ github.run_number }}.vsix
          tag_name: 1.3.${{ github.run_number }}
          name: 1.3.${{ github.run_number }}
          draft: false
          fail_on_unmatched_files: true
          generate_release_notes: true
          token: ${{ secrets.GITHUB_TOKEN }}